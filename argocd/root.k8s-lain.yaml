apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yasuoiwakura/gitops-kubernetes-homelab-cluster.git
    path: argocd/k8s-lain
    targetRevision: main
    directory:
      recurse: true
      exclude: "__none__"   # use "gateway/*" to skip argocd/k8s-lain/gateway/
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
