# Cluster configuration example
# Copy this file, rename it, and adjust the values to match your environment.
# Source: doc/lxc-k3s.md

# === LXC (PVE) ===
VMID=YOUR_VMID
IGNORE_EXISTING_CONTAINER=false   # true = don't abort if container exists
HOSTNAME=YOUR_HOSTNAME
MEMORY=4096
CORES=4
BRIDGE=vmbr0                     # your PVE bridge name
IP=YOUR_IP/24
GATEWAY=YOUR_GATEWAY
NAMESERVER=YOUR_DNS

# Storage / Template
PVE_STORAGE=YOUR_STORAGE              # for template download
TEMPLATE="$PVE_STORAGE:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst"
ROOTFS_STORAGE=YOUR_ROOTFS_STORAGE
ROOTFS_SIZE=100
UNPRIVILEGED=0                         # 0 = privileged (needed for k3s)
# I_DONT_CARE_PRIVILEGED_CONTAINERS_ARE_INSECURE=true

# === k3s ===
DISABLE_TRAEFIK=true                   # true = without Traefik (recommended)
K3S_VERSION=""                         # empty = latest

# === Packages (apt) ===
APT_UPGRADE=false                    # true = run apt upgrade -y
PACKAGES="screen mc curl net-tools git"

# === Data mount (PVE host → LXC) ===
DATA_MOUNT_SRC=YOUR_HOST_PATH
DATA_MP=YOUR_LXC_MOUNTPOINT

# === Preflight check (optional) ===
# Create an executable file on the data volume that checks whether it is mounted.
# If the file is missing → container won't start (lxc.hook.pre-start).
# e.g.: echo '#!/bin/true' > YOUR_PATH/.mounted && chmod +x $_
PREFLIGHT_CHECK_SCRIPT=YOUR_PATH/.mounted

# === ArgoCD ===
ARGOCD_SERVICE_MODE=NodePort       # ClusterIP | NodePort | LoadBalancer
ARGOCD_NODEPORT=30444
GITEA_REPO_URL=ssh://git@YOUR_GIT_SERVER:PORT/YOUR_USER/YOUR_REPO.git

# === PS1 color ===
CLUSTER_LABEL="[YOUR_CLUSTER]"
