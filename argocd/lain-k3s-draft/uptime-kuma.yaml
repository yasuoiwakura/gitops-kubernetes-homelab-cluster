apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/external-link: http://203.0.113.10:30001
spec:
  project: default
  source:
    repoURL: https://github.com/yasuoiwakura/gitops-kubernetes-homelab-cluster.git
    path: overlays/lain-k3s-draft/uptime-kuma
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: uptime-kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
