# Default LXC configuration for k3s provisioning
# Concrete, generic values so it provisions out of the box.
# Adjust IP/gateway/DNS/storage to your network.
#
# Privileged LXC: the script prompts "Continue? [y/N]".
# For automation use: ./provision-pve-lxc.sh default-lxc.conf --yes

# === LXC (PVE) ===
VMID=9001
IGNORE_EXISTING_CONTAINER=false
HOSTNAME=k3s-node
MEMORY=4096
CORES=4
BRIDGE=vmbr0
IP=192.168.1.101/24
GATEWAY=192.168.1.1
NAMESERVER=1.1.1.1

# Storage / Template
PVE_STORAGE=local
TEMPLATE="$PVE_STORAGE:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst"
ROOTFS_STORAGE=local-lvm
ROOTFS_SIZE=20
UNPRIVILEGED=0
# Set this to true to skip the interactive security prompt:
# I_DONT_CARE_PRIVILEGED_CONTAINERS_ARE_INSECURE=true

# === k3s ===
DISABLE_TRAEFIK=true
K3S_VERSION=""

# === Packages (apt) ===
APT_UPGRADE=false
PACKAGES="screen mc curl net-tools git"

# === Data mount (optional) ===
DATA_MOUNT_SRC=""
DATA_MP=""
PREFLIGHT_CHECK_SCRIPT=""

# === ArgoCD (optional) ===
# false = plain k3s only; true requires GITEA_REPO_URL and the ArgoCD steps
ARGOCD_ENABLED=false
ARGOCD_SERVICE_MODE=NodePort
ARGOCD_NODEPORT=30444
# GITEA_REPO_URL=ssh://git@YOUR_GIT_SERVER:PORT/YOUR_USER/YOUR_REPO.git

# === PS1 color ===
CLUSTER_LABEL="[k3s-node]"
