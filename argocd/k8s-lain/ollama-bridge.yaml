apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-bridge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yasuoiwakura/gitops-kubernetes-homelab-cluster.git
    path: base/ollama-bridge
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: ollama-bridge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
