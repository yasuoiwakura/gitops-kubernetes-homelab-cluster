# Debug Configuration for Cloud-init Testing
# Minimal config without Kubernetes - just for testing cloud-init

# VM Settings
VMID=199
VM_NAME="debug-node"
MEMORY=2048
CORES=1
CPU="host"
STORAGE="local-lvm"
DISK_SIZE="10G"

# Cloud Image
CLOUD_IMAGE_URL="https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img"
CLOUD_IMAGE_PATH="/root/ubuntu-26.04-server-cloudimg-amd64.img"

# SSH Public Key (from root's authorized_keys)
SSH_KEY_PATH="/root/.ssh/authorized_keys"

# Kubernetes version (not used in debug mode)
K8S_VERSION="1.37"

# Network configuration (static IP)
IP_ADDRESS="192.168.0.199/24"
GATEWAY="192.168.0.1"
# DNS servers (space-separated, will be quoted in qm set)
DNS_SERVER="1.1.1.1 8.8.4.4"

# Pod Network CIDR (not used in debug mode)
POD_NETWORK_CIDR="10.244.0.0/16"

# Cloud-init YAML template (debug template)
CLOUD_INIT_TEMPLATE="debug-cloud-init.yaml"

# Disable automatic package upgrade (stronger than vendor-data setting)
CIUPGRADE=0

# Set cloud-init user to root (SSH keys will be applied to root)
CIUSER="root"