#cloud-config
# ===========================================
# Kubernetes Control Plane Cloud-init Config
# ===========================================

# System configuration
hostname: ${VM_NAME}
manage_etc_hosts: true
locale: en_US.UTF-8
timezone: UTC

# User configuration
# users:
#   - name: ubuntu
#     groups: sudo
#     shell: /bin/bash
#     sudo: ['ALL=(ALL) NOPASSWD:ALL']
#     ssh_authorized_keys:
# ${SSH_KEY_YAML}
#   - name: root
#     ssh_authorized_keys:
# ${SSH_KEY_YAML}
#     lock_passwd: false

ssh_pwauth: true
disable_root: false

# The provisioning status helpers write below this directory
bootcmd:
  - mkdir -p /var/lib/provisioning /etc/argocd

# System configuration files
write_files:
  # Kubernetes sysctl settings
  - path: /etc/sysctl.d/k8s.conf
    owner: root:root
    permissions: '644'
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
  
  # Kernel modules
  - path: /etc/modules-load.d/k8s.conf
    owner: root:root
    permissions: '644'
    content: |
      overlay
      br_netfilter
  
  # Kubelet configuration (explicit cgroup driver)
  - path: /var/lib/kubelet/config.yaml
    owner: root:root
    permissions: '644'
    content: |
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      cgroupDriver: systemd

  # Provisioning status helpers (toggle: PROVISION_STATUS in the config)
  - path: /usr/local/bin/provision-stage
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/sh
      # Record a provisioning stage in /var/lib/provisioning/state.env
      set -u
      dir=/var/lib/provisioning
      start=$dir/start.env
      state=$dir/state.env
      mkdir -p "$dir"
      [ "$1" = "start" ] && cp "$start" "$state" 2>/dev/null || true
      [ -f "$state" ] || cp "$start" "$state" 2>/dev/null || true
      stage=$(printf '%s' "$1" | tr '[:lower:]' '[:upper:]')
      epoch=$(date +%s)
      iso=$(date -u +%FT%TZ)
      printf 'PROVISION_TS_%s="%s %s"\n' "$stage" "$epoch" "$iso" >> "$state"
      if [ "$1" = "done" ]; then
          printf 'PROVISION_DONE="%s"\nPROVISION_DONE_EPOCH="%s"\n' "$iso" "$epoch" >> "$state"
      fi

  - path: /usr/local/bin/provision-status
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/sh
      # Provisioning status from /var/lib/provisioning/{start,state}.env
      set -u

      DIR=/var/lib/provisioning
      START_ENV=$DIR/start.env
      STATE_ENV=$DIR/state.env
      CI_LOG=/var/log/cloud-init-output.log

      MODE=full
      case "${1:-}" in
          --short) MODE=short ;;
          --benchmark) MODE=benchmark ;;
      esac

      if [ -r "$STATE_ENV" ]; then
          . "$STATE_ENV"
      elif [ -r "$START_ENV" ]; then
          . "$START_ENV"
      else
          printf 'provisioning: no data (%s missing)\n' "$START_ENV"
          exit 0
      fi

      _host=$(hostname 2>/dev/null || echo unknown)
      _now=$(date +%s)
      PROVISION_START_EPOCH=${PROVISION_START_EPOCH:-$_now}

      fmt_dur() {
          _d=${1:-0}
          [ "$_d" -lt 0 ] && _d=0
          printf '%dm%02ds' $((_d / 60)) $((_d % 60))
      }
      short_hash() {
          [ -z "${1:-}" ] && return 0
          printf '%s' "$1" | cut -c1-12
      }
      ts_epoch() {
          set -- ${1:-}
          printf '%s' "${1:-}"
      }

      # Current stage (last marker wins)
      _stage=""
      for _s in DONE HELM FLANNEL KUBEADM PACKAGES START; do
          eval "_v=\${PROVISION_TS_$_s:-}"
          if [ -n "$_v" ]; then
              _stage=$_s
              break
          fi
      done

      _step=1
      _label="cloud-init packages"
      case "$_stage" in
          START)    _step=2; _label="base" ;;
          PACKAGES) _step=3; _label="kubeadm" ;;
          KUBEADM)  _step=4; _label="flannel" ;;
          FLANNEL)  _step=5; _label="helm" ;;
          HELM)     _step=6; _label="finalize" ;;
          DONE)     _step=6; _label="done" ;;
      esac

      if [ -n "${PROVISION_DONE:-}" ] && [ -n "${PROVISION_DONE_EPOCH:-}" ]; then
          _state=done
          _elapsed=$((PROVISION_DONE_EPOCH - PROVISION_START_EPOCH))
      else
          _state=running
          _elapsed=$((_now - PROVISION_START_EPOCH))
      fi
      [ "$_elapsed" -lt 0 ] && _elapsed=0

      _git_ok=no
      [ -n "${GIT_BRANCH:-}" ] && [ "$GIT_BRANCH" != "unknown" ] && _git_ok=yes

      if [ "$MODE" = "short" ]; then
          if [ "$_state" = "done" ]; then
              printf '[%s] provisioning: done - %s\n' "$_host" "$(fmt_dur "$_elapsed")"
          else
              printf '[%s] provisioning: running - step %d/6 %s - %s\n' \
                  "$_host" "$_step" "$_label" "$(fmt_dur "$_elapsed")"
          fi
          if [ "$_git_ok" = "yes" ]; then
              printf ' git: %s/%s@%s (%s)\n' \
                  "${REPO_NAME:-?}" "$GIT_BRANCH" "${GIT_COMMIT:-?}" "${GIT_COMMIT_DATE%%T*}"
          fi
          if [ "$_state" != "done" ] && cloud-init status 2>/dev/null | grep -q 'status:.*done'; then
              printf ' warning: cloud-init done but no done marker - runcmd incomplete\n'
          fi
          exit 0
      fi

      if [ "$MODE" = "benchmark" ]; then
          _prev=$PROVISION_START_EPOCH
          bench() {
              [ -z "${2:-}" ] && return 0
              _ts=$(ts_epoch "$2")
              [ -z "$_ts" ] && return 0
              printf '  %-10s %s\n' "$1" "$(fmt_dur $((_ts - _prev)))"
              _prev=$_ts
          }
          printf 'benchmark: %s\n' "$_host"
          bench "pre-runcmd" "${PROVISION_TS_START:-}"
          bench "base" "${PROVISION_TS_PACKAGES:-}"
          bench "kubeadm" "${PROVISION_TS_KUBEADM:-}"
          bench "flannel" "${PROVISION_TS_FLANNEL:-}"
          bench "helm" "${PROVISION_TS_HELM:-}"
          bench "finalize" "${PROVISION_TS_DONE:-}"
          if [ "$_state" != "done" ]; then
              printf '  %-10s %s (running)\n' "current" "$(fmt_dur $((_now - _prev)))"
          fi
          printf '  %-10s %s\n' "total" "$(fmt_dur "$_elapsed")"
          exit 0
      fi

      _ci_status=$(cloud-init status 2>/dev/null | sed 's/^status: //')
      [ -n "$_ci_status" ] || _ci_status=unknown

      printf '=== provisioning: %s =========================\n' "$_host"
      printf ' Type      : %s\n' "${PROVISION_ROLE:-unknown}"
      if [ "$_git_ok" = "yes" ]; then
          printf ' Git       : %s/%s@%s (%s)' \
              "${REPO_NAME:-?}" "$GIT_BRANCH" "${GIT_COMMIT:-?}" "${GIT_COMMIT_DATE%%T*}"
          [ "${GIT_DIRTY:-no}" = "yes" ] && printf ' dirty'
          printf '\n'
      else
          printf ' Git       : unknown\n'
      fi
      [ -n "${CONF_FILE:-}" ] && printf ' Config    : %s  sha256 %s\n' "$CONF_FILE" "$(short_hash "${CONF_SHA256:-}")"
      if [ -n "${SCRIPT_FILE:-}" ] && [ -n "${TEMPLATE_FILE:-}" ]; then
          printf ' Files     : %s %s  %s %s\n' \
              "$SCRIPT_FILE" "$(short_hash "${SCRIPT_SHA256:-}")" \
              "$TEMPLATE_FILE" "$(short_hash "${TEMPLATE_SHA256:-}")"
      fi
      printf ' Cloud-init: %s\n' "$_ci_status"
      printf ' Step      : %d/6 - %s\n' "$_step" "$_label"
      if [ "$_state" = "done" ]; then
          printf ' Provision : start %s  done %s\n' "${PROVISION_START:-?}" "${PROVISION_DONE:-?}"
          printf ' Duration  : %s\n' "$(fmt_dur "$_elapsed")"
      else
          printf ' Provision : start %s\n' "${PROVISION_START:-?}"
          printf ' Elapsed   : %s\n' "$(fmt_dur "$_elapsed")"
          if cloud-init status 2>/dev/null | grep -q 'status:.*done'; then
              printf ' WARNING   : cloud-init done but no done marker - runcmd incomplete\n'
          fi
      fi
      case "$_ci_status" in
          error*) printf ' Log       : %s\n' "$CI_LOG" ;;
      esac
      printf ' Data      : %s, %s\n' "$START_ENV" "$STATE_ENV"
      printf '==================================================\n'

  - path: /var/lib/provisioning/start.env
    owner: root:root
    permissions: '0644'
    content: |
      PROVISION_STATUS="${PROVISION_STATUS}"
      PROVISION_ROLE="${PROVISION_ROLE}"
      REPO_NAME="${REPO_NAME}"
      GIT_BRANCH="${GIT_BRANCH}"
      GIT_COMMIT="${GIT_COMMIT}"
      GIT_COMMIT_DATE="${GIT_COMMIT_DATE}"
      GIT_DIRTY="${GIT_DIRTY}"
      PROVISION_START="${PROVISION_START}"
      PROVISION_START_EPOCH="${PROVISION_START_EPOCH}"
      SCRIPT_FILE="${SCRIPT_FILE}"
      SCRIPT_SHA256="${SCRIPT_SHA256}"
      CONF_FILE="${CONF_FILE}"
      CONF_SHA256="${CONF_SHA256}"
      TEMPLATE_FILE="${TEMPLATE_FILE}"
      TEMPLATE_SHA256="${TEMPLATE_SHA256}"

  - path: /etc/profile.d/99-provision-status.sh
    owner: root:root
    permissions: '0644'
    content: |
      # Show provisioning status on interactive login (PROVISION_STATUS=true)
      if [ -r /var/lib/provisioning/start.env ]; then
          . /var/lib/provisioning/start.env
          if [ "${PROVISION_STATUS:-false}" = "true" ]; then
              /usr/local/bin/provision-status --short
          fi
      fi

  # ArgoCD bootstrap files (only used when ARGOCD_ENABLED=true)
  - path: /etc/argocd/repo-key
    owner: root:root
    permissions: '0600'
    encoding: base64
    content: |
      ${ARGOCD_REPO_KEY_B64}

  - path: /etc/argocd/root-app.yaml
    owner: root:root
    permissions: '0644'
    content: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: root
        namespace: argocd
      spec:
        project: default
        source:
          repoURL: ${ARGOCD_REPO_URL}
          path: ${ARGOCD_ROOT_APP_PATH}
          targetRevision: ${ARGOCD_TARGET_REVISION}
          directory:
            recurse: true
            exclude: ${ARGOCD_DIRECTORY_EXCLUDE}
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true

# Package management
package_update: true
package_upgrade: ${PACKAGE_UPGRADE}
packages:
  - apt-transport-https
  - ca-certificates
  - openssh-client
  - curl
  - gpg
  - containerd
  - software-properties-common
  - jq
  - yq
  - vim
  - net-tools
  - iputils-ping
  - bind9-dnsutils

# System commands
runcmd:
  # Provisioning stage markers (read by provision-status)
  - provision-stage start

  # Disable swap
  - swapoff -a
  - sed -i '/ swap / s/^/#/' /etc/fstab
  
  # Load kernel modules
  - modprobe overlay
  - modprobe br_netfilter
  
  # Apply sysctl settings
  - sysctl --system
  
  # Configure containerd for cgroup v2
  - mkdir -p /etc/containerd
  - containerd config default | tee /etc/containerd/config.toml >/dev/null
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  
  # Ensure CRI plugin is not disabled
  - sed -i '/disabled_plugins.*cri/d' /etc/containerd/config.toml
  
  - systemctl restart containerd
  - systemctl enable containerd
  
  # Install nerdctl (Docker-compatible CLI for containerd)
  - NERDCTL_VERSION="2.0.0"
  - wget https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz
  - tar xzf nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz -C /usr/local/bin/
  - rm nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz
  - provision-stage packages
  
  # Add Kubernetes repository
  - mkdir -p -m 755 /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v${K8S_VERSION}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${K8S_VERSION}/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  
  # Install Kubernetes components
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl
  - systemctl enable kubelet
  
  # Initialize Kubernetes control plane (single node)
  - kubeadm init --pod-network-cidr=${POD_NETWORK_CIDR} --apiserver-advertise-address=${IP_ADDRESS%/*}
  
  # Setup kubeconfig for root user
  # NOTE: $HOME may not be /root in the cloud-init/runcmd environment, which makes
  # kubectl fall back to localhost:8080. Set KUBECONFIG explicitly for all
  # subsequent runcmd commands.
  - mkdir -p /root/.kube
  - cp -f /etc/kubernetes/admin.conf /root/.kube/config
  - chown root:root /root/.kube/config
  - export KUBECONFIG=/etc/kubernetes/admin.conf
  
  # Verify cluster is ready
  - kubectl get nodes
  - kubectl get pods -n kube-system
  - provision-stage kubeadm
  
  # Install Flannel CNI
  - kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  
  # Wait for Flannel to be ready
  - sleep 30
  
  # Allow scheduling on control plane (single-node cluster)
  - kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
  - provision-stage flannel
  
  # Install Helm (same method as the LXC path)
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  - provision-stage helm

  # ArgoCD bootstrap (ARGOCD_ENABLED=true)
  - |
    if [ "${ARGOCD_ENABLED}" = "true" ]; then
      KNOWN_HOSTS_ARG=""
      case "${ARGOCD_REPO_URL}" in
        ssh://*)
          ssh-keyscan -p "${ARGOCD_REPO_PORT}" "${ARGOCD_REPO_HOST}" > /tmp/argocd_known_hosts 2>/dev/null || true
          KNOWN_HOSTS_ARG="--set-file configs.ssh.knownHosts=/tmp/argocd_known_hosts"
          ;;
      esac
      helm repo add argo https://argoproj.github.io/argo-helm --force-update
      helm upgrade --install argocd argo/argo-cd \
        --namespace argocd --create-namespace \
        --version "${ARGOCD_CHART_VERSION}" \
        --set server.service.type=NodePort \
        --set server.service.nodePortHttp=30081 \
        --set server.service.nodePortHttps="${ARGOCD_NODEPORT}" \
        $KNOWN_HOSTS_ARG

      # Wait for ArgoCD to become ready (no hard --wait on the release)
      kubectl -n argocd rollout status deployment/argocd-server --timeout=600s || \
        echo "WARNING: argocd-server not ready after 600s"
      kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=600s || \
        echo "WARNING: argocd-repo-server not ready after 600s"
      kubectl -n argocd rollout status statefulset/argocd-application-controller --timeout=300s || \
        kubectl -n argocd rollout status deployment/argocd-application-controller --timeout=300s || \
        echo "WARNING: argocd-application-controller not ready after 300s"

      # Git repository credentials (public HTTPS needs none)
      case "${ARGOCD_REPO_URL}" in
        ssh://*)
          kubectl create secret generic repo-k8s-apps -n argocd \
            --from-literal=type=git \
            --from-literal=url="${ARGOCD_REPO_URL}" \
            --from-file=sshPrivateKey=/etc/argocd/repo-key \
            --dry-run=client -o yaml | kubectl apply -f -
          ;;
        *)
          kubectl create secret generic repo-k8s-apps -n argocd \
            --from-literal=type=git \
            --from-literal=url="${ARGOCD_REPO_URL}" \
            --dry-run=client -o yaml | kubectl apply -f -
          ;;
      esac
      kubectl label secret repo-k8s-apps -n argocd \
        argocd.argoproj.io/secret-type=repository --overwrite
      kubectl -n argocd rollout restart deployment/argocd-repo-server
      kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=300s || true

      # Root app (app-of-apps)
      kubectl apply -f /etc/argocd/root-app.yaml
      sync=""
      for i in 1 2 3 4 5 6; do
        sync=$(kubectl -n argocd get application root -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
        [ "$sync" = "Synced" ] && break
        sleep 10
      done
      echo "ArgoCD: https://${IP_ADDRESS%/*}:${ARGOCD_NODEPORT}"
      echo "ArgoCD root app sync: ${sync:-unknown}"
      kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true
      echo
    fi
  
  # Final verification
  - echo "Cluster is ready!"
  - kubectl get nodes
  - kubectl get pods -A

  # place simple net test kubernetes script
  - echo 'kubectl run nettest --image=wbitt/network-multitool --rm -it --restart=Never -- bash -c "dig api.cheapestinference.com && curl -v --connect-timeout 10 https://api.cheapestinference.com/v1/models && echo DONE"' > /root/nettest.sh

  # Kubernetes CLI convenience (K8S_CONVENIENCE in the config):
  # install kubectx/kubens, add 'k' alias and bash completion
  - |
    if [ "${K8S_CONVENIENCE}" = "true" ]; then
      apt-get install -y bash-completion kubectx
      cat >> /root/.bashrc <<'EOF'

    # --- k8s convenience (K8S_CONVENIENCE=true) ---
    alias k=kubectl
    alias kx=kubectx
    alias kn=kubens
    source <(kubectl completion bash)
    complete -o default -F __start_kubectl k
    source <(helm completion bash)
    [ -f /usr/share/bash-completion/completions/kubectx.bash ] && . /usr/share/bash-completion/completions/kubectx.bash
    [ -f /usr/share/bash-completion/completions/kubens.bash ] && . /usr/share/bash-completion/completions/kubens.bash
    EOF
    fi

  # "done" only when the cluster API is healthy and Helm (and ArgoCD, if enabled) is installed
  - kubectl get --raw /readyz >/dev/null 2>&1 && /usr/local/bin/helm version >/dev/null 2>&1 && { [ "${ARGOCD_ENABLED}" != "true" ] || { kubectl -n argocd wait --for=condition=Ready pod -l app.kubernetes.io/name=argocd-server --timeout=60s >/dev/null 2>&1 && kubectl -n argocd wait --for=condition=Ready pod -l app.kubernetes.io/name=argocd-application-controller --timeout=60s >/dev/null 2>&1; }; } && provision-stage done || true

# Reboot after cloud-init is finished (applies kernel/systemd changes cleanly)
power_state:
  mode: reboot
  message: "Cloud-Init abgeschlossen, System neu zu starten..."
  timeout: 30
  condition: test -f /var/lib/cloud/instance/boot-finished