# Full GitOps setup: ArgoCD + Gateway API (NGINX Gateway Fabric)
# Uses the public GitHub mirror, so no SSH deploy key is required.
# Usage: ./create-k8s-vm.sh default-argocd.conf
#
# Requirements in the target repository:
# - path argocd/k8s-lain exists
# - the child Applications in argocd/k8s-lain/ use this same public repoURL
#   (the export/anonymization step rewrites the private Git URLs)

source "$(dirname "${BASH_SOURCE[0]}")/default.conf"

# ArgoCD needs more headroom than the minimal playground
MEMORY=3072

# ArgoCD bootstrap from the public GitHub repository (anonymous HTTPS)
ARGOCD_ENABLED=true
ARGOCD_CHART_VERSION="10.11.6"   # ArgoCD 3.5.6
ARGOCD_NODEPORT=30444
ARGOCD_REPO_URL="https://github.com/yasuoiwakura/gitops-kubernetes-homelab-cluster.git"
ARGOCD_REPO_KEY=""               # empty = anonymous HTTPS
ARGOCD_ROOT_APP_PATH="argocd/k8s-lain"
ARGOCD_TARGET_REVISION="main"

# Include argocd/k8s-lain/gateway/ (Gateway API CRDs + NGF + Gateway)
GATEWAY_ENABLED=true
