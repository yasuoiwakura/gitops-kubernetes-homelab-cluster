# Default Configuration for Kubernetes VM Provisioning
# Minimal vanilla Kubernetes: no ArgoCD, no API gateway, low RAM.
# Copy this file, rename it, and adjust the values for your environment.

# VM Settings
VMID=9000
VM_NAME="k8s-node"
MEMORY=2048
CORES=2
CPU="host"
STORAGE="local-lvm"
DISK_SIZE="20G"

# Cloud Image
CLOUD_IMAGE_URL="https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img"
CLOUD_IMAGE_PATH="/root/ubuntu-26.04-server-cloudimg-amd64.img"

# SSH Public Key (from root's authorized_keys)
SSH_KEY_PATH="/root/.ssh/authorized_keys"

# Kubernetes version (1.36 is the newest tested with ArgoCD 3.5)
K8S_VERSION="1.36"

# Network configuration (static IP)
# Adjust these values for your network!
IP_ADDRESS="192.168.1.100/24"
GATEWAY="192.168.1.1"
# DNS servers (space-separated, will be quoted in qm set)
DNS_SERVER="8.8.8.8 8.8.4.4"

# Pod Network CIDR (Flannel default)
POD_NETWORK_CIDR="10.244.0.0/16"

# Cloud-init YAML template (optional, default: k8s-cloud-init.yaml)
CLOUD_INIT_TEMPLATE="k8s-cloud-init.yaml"

# Set cloud-init user to root (SSH keys will be applied to root)
CIUSER="root"
CIUPGRADE=0  # Proxmox-level ciupgrade off; PACKAGE_UPGRADE controls the guest upgrade

# Cloud-init apt upgrade (set false for faster test runs)
PACKAGE_UPGRADE=true

# Kubernetes CLI convenience: 'k' alias, completion, kubectx/kubens
K8S_CONVENIENCE=true

# Provisioning status: cloud-init stage + duration on login
PROVISION_STATUS=true
PROVISION_ROLE="k8s-vm"

# GitOps / ArgoCD / API gateway: see default-argocd.conf
